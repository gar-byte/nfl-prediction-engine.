[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-prediction-engine"
version = "0.1.0"
description = "Reproducible NFL game forecasts, walk-forward evaluation, and betting line analysis"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "scikit-learn>=1.3,<2", "streamlit>=1.32,<2"]

[project.optional-dependencies]
dev = ["pytest>=7.4,<10"]

[project.scripts]
nfl-engine = "nfl_engine.cli:main"

[tool.setuptools.packages.find]
include = ["nfl_engine*"]
